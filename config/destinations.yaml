obsidian_root: Market

categories:
  daily:
    description: QQQM 등락 원인 + 시장 분위기
    slack_channel: market-daily
    slack_channel_id: C0CBNLG5FHR
    obsidian_dir: 01-Daily
    file_pattern: "{yyyy}/{mm}/{yyyy}-{mm}-{dd}.md"
