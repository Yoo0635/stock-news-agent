  etf:
    description: ETF 전반 소식 (자금 흐름, 상장, 리밸런싱)
    slack_channel: market-etf
    slack_channel_id: C0CBPJL3GQ5
    obsidian_dir: 02-ETF
    file_pattern: "{yyyy}/{mm}/{yyyy}-{mm}-{dd}.md"
    template: _Templates/etf.md

  macro:
    description: 금리·달러·VIX, 경제지표·실적 일정
    slack_channel: market-macro
    slack_channel_id: C0CBSUDENPQ
    obsidian_dir: 03-Macro
    file_pattern: "{yyyy}/{mm}/{yyyy}-{mm}-{dd}.md"
    template: _Templates/macro.md

  weekly:
    description: 주간 요약 (v2)
    slack_channel: market-weekly
    slack_channel_id: C0CBNLGA1L3
